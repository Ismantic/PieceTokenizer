name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: C++ tests
        run: ./build/piece_tokenizer_test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python package smoke test
        run: |
          python -m pip install .
          cd /tmp
          python -c "import piece_tokenizer as pt; assert pt.BERTcTokenizer().vocab_size() == 12535"
          python -c "import piece_tokenizer as pt; assert pt.SummerTokenizer().vocab_size() == 81903"
